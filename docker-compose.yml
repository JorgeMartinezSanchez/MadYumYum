services:
  flask-api:
    build: ./backend/flask/
    container_name: backend
    volumes:
      - ./backend/flask:/app
    ports:
      - "5000:5000"
    networks:
      - default
    depends_on:
      postgresql:
        condition: service_healthy

  django:
    build: ./backend/myy_django/
    container_name: backend_django
    ports:
      - "8000:8000"
    volumes:
      - ./backend/myy_django:/app
    networks:
      - default
    depends_on:
      postgresql:
        condition: service_healthy
  
  postgresql:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.ddl:/docker-entrypoint-initdb.d/schema.ddl
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
    driver: bridge